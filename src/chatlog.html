<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulated Chat · Chat Detective</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden}body{margin:0;display:flex;flex-direction:column;background:#101719;color:#f8f6f0;font:23px/1.35 system-ui,sans-serif;padding:26px;background-image:radial-gradient(ellipse at 8% 0,#35464a 0,transparent 44%),linear-gradient(145deg,#101719,#1b2425)}header{flex:none;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #7b6543;padding-bottom:15px;margin-bottom:16px}h1{margin:0;font:700 26px ui-monospace,Consolas,monospace;letter-spacing:.08em;color:#efc66e}.live{color:#b9d198;font:700 18px ui-monospace,Consolas,monospace}main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-color:#9b8354 #182022}.line{padding:12px 8px;border-bottom:1px solid #ffffff24;animation:arrive .2s ease-out;color:#f8f6f0;font-size:23px;text-shadow:0 1px 2px #000;opacity:.82}.line b{color:#f2c96c;font-weight:750}.line em{float:right;color:#d3cdbd;font:17px ui-monospace,Consolas,monospace;font-style:normal}.empty{color:#d0cbbf;font-style:italic}@keyframes arrive{from{opacity:1;transform:translateY(8px)}to{opacity:.82;transform:none}}
</style></head><body><header><h1>SIMULATED CHAT</h1><div class="live">● LIVE CROWD · 12 VIEWERS</div></header><main id="lines"><div class="empty">Waiting for the crowd…</div></main>
<script>
const root=document.getElementById('lines'),escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(s){const lines=(s.chatLines||[]).slice(-20);root.innerHTML=lines.map(l=>`<div class="line"><b>${escapeHtml(l.user)}</b>: ${escapeHtml(l.text)} <em>${escapeHtml(l.source)}</em></div>`).join('')||'<div class="empty">Waiting for the crowd…</div>';root.scrollTop=root.scrollHeight}
const url=new URL('/events',location.href);const stream=new EventSource(url);stream.onmessage=e=>{try{render(JSON.parse(e.data))}catch{}};fetch('/state').then(r=>r.json()).then(render);setInterval(()=>fetch('/state').then(r=>r.json()).then(render).catch(()=>{}),1000);
</script></body></html>

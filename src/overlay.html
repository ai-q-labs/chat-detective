<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Chat Detective · OBS Overlay</title>
<style>
:root{--paper:#f1e8d5;--gold:#e5b65d;--red:#c64237;--panel:#171b1d;--muted:#bdb5a5;--a:#cf765c;--b:#6b9fb4;--c:#8da66a;--d:#b08ac0}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#f4efe7;font:28px/1.22 system-ui,sans-serif}body{position:relative}
#backdrop{display:none;position:fixed;inset:0;z-index:0;overflow:hidden;background:#11191d}body.with-backdrop #backdrop{display:block}#backdrop::before{content:"";position:absolute;inset:-25%;background:radial-gradient(ellipse at 22% 36%,#41606b 0,transparent 38%),radial-gradient(ellipse at 76% 70%,#6b5133 0,transparent 39%),linear-gradient(125deg,#11191d,#28353a,#182126);background-size:170% 170%;animation:drift 18s ease-in-out infinite alternate}#backdrop span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:700 34px ui-monospace,Consolas,monospace;letter-spacing:.16em;color:#e9e2d4a8;text-transform:uppercase}
#stage-root{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:top left;overflow:hidden;z-index:1;background:transparent}
.board{position:absolute;z-index:2;top:28px;right:28px;bottom:28px;width:560px;padding:23px 24px 0;background:rgba(23,27,29,.97);border:2px solid #625b4d;border-radius:15px;box-shadow:0 18px 70px #0009;display:flex;flex-direction:column;overflow:hidden}.board-strings{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}.board-string{fill:none;stroke:#bd302e;stroke-width:4;filter:drop-shadow(0 0 4px #bd302e);stroke-dasharray:1200;stroke-dashoffset:0;animation:string .6s ease-out}.board>*:not(.board-strings){position:relative;z-index:2}
.tag,.eyebrow{font:700 28px/1.1 ui-monospace,Consolas,monospace;letter-spacing:.13em;color:var(--gold)}h1,h2,h3{font-family:ui-monospace,Consolas,monospace;margin:0}.title{font-size:32px;line-height:1.15;margin:8px 0 10px}.intro{font-size:28px;color:#ded8cc;max-height:124px;overflow:auto;flex:none}
.board-heading{height:38px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px}.tag{font:700 28px/1.1 ui-monospace,Consolas,monospace;letter-spacing:.13em;color:var(--gold)}.sim-pill{display:none;padding:5px 9px;border:1px solid #c28b45;border-radius:99px;color:#f3c568;background:#3a3020;font:700 16px/1 ui-monospace,Consolas,monospace;letter-spacing:.08em;white-space:nowrap}.sim-pill.show{display:block}
.suspects{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:13px 0 15px;flex:none}.suspect{padding:8px;background:#292e30;border:1px solid #3d4242;border-radius:8px;min-height:78px;overflow:hidden}.suspect.liar{grid-column:span 2;border-color:#8e3934;background:#302827}.suspect-head{display:flex;align-items:center;gap:9px;min-width:0}.initial{display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:50%;font-weight:800;color:#171b1d;background:#8b9290}.suspect[data-id="A"] .initial{background:var(--a)}.suspect[data-id="B"] .initial{background:var(--b)}.suspect[data-id="C"] .initial{background:var(--c)}.suspect[data-id="D"] .initial{background:var(--d)}.suspect b,.suspect small{font-size:28px;line-height:1.06}.suspect b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.suspect small{display:block;color:#d0cabf;margin:4px 0 0 45px;white-space:normal;line-height:1.08;max-height:2.2em;overflow:hidden}.lie-stamp{display:inline-block;margin:7px 0 0 45px;padding:2px 7px;color:#ffd5ca;background:#922f2d;border-radius:4px;font:800 19px/1.1 ui-monospace,Consolas,monospace;letter-spacing:.04em}.lie-truth{margin:4px 0 0 45px;color:#f2d7c9;font-size:20px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag,.eyebrow{font:700 28px/1.1 ui-monospace,Consolas,monospace;letter-spacing:.13em;color:var(--gold)}
.evidence-title{font-size:28px;color:#d5c8ae;margin:0 0 8px;flex:none}.evidence-list{display:flex;flex-direction:column;gap:8px;min-height:0;flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 4px 12px 0;scrollbar-color:#76694f #25292a;scrollbar-width:thin}.evidence-slot{position:relative;z-index:2;flex:none;min-height:108px;padding:12px 14px;border-radius:7px;transform-origin:left center;transition:transform .45s,background .4s,border-color .4s,opacity .4s;overflow:hidden}.evidence-slot.face-down{display:flex;align-items:center;gap:13px;background:#353936;border:1px dashed #81765d;color:#d0c5ae}.evidence-slot.face-up{background:var(--paper);border:1px solid #cbbda3;color:#25231e;animation:flip .55s}.evidence-slot .question{font:700 42px ui-monospace,Consolas,monospace;color:var(--gold);width:46px;flex:none;text-align:center}.evidence-copy{min-width:0;font-size:25px;line-height:1.18}.evidence-copy h3{font-size:27px;margin:0 0 4px}.evidence-copy p{font-size:25px;line-height:1.18;margin:0}.evidence-slot.face-down .evidence-copy p{font-size:25px}.board-footer{height:62px;min-height:62px;flex:none;border-top:1px solid #5d5547;margin:0 -24px;padding:9px 18px;background:#202526;color:#c9bfad;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:space-between;gap:9px;white-space:nowrap;overflow:hidden}.board-footer span{display:block;overflow:hidden;text-overflow:ellipsis}.board-footer strong{color:var(--gold);flex:1}
.stage-panel{position:absolute;z-index:2;left:28px;right:620px;bottom:28px;height:220px;background:rgba(23,27,29,.97);border:2px solid #625b4d;border-radius:15px;padding:15px 22px;box-shadow:0 18px 70px #0009;overflow:hidden}.stage-top{display:flex;align-items:center;gap:18px;height:100%}.ballot{flex:1;min-width:0}.ballot h2{font-size:28px;color:var(--gold);margin-bottom:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.options{display:grid;grid-template-columns:repeat(var(--option-count,3),minmax(0,1fr));gap:12px}.option{min-width:0}.option-label{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:26px;line-height:1.1;white-space:nowrap;overflow:hidden}.option-label span{min-width:0;overflow:hidden;text-overflow:ellipsis}.option-label b{flex:none}.track{height:13px;background:#454747;border-radius:10px;overflow:hidden;margin-top:7px}.track i{display:block;height:100%;background:linear-gradient(90deg,#b7773a,#f0c666);transition:width .5s}.timer{position:relative;width:92px;height:92px;flex:none}.timer svg{transform:rotate(-90deg)}.timer circle{fill:none;stroke:#494a45;stroke-width:8}.timer .progress{stroke:var(--gold);stroke-linecap:round;stroke-dasharray:226;stroke-dashoffset:0;transition:stroke-dashoffset .5s}.timer b{position:absolute;inset:0;display:grid;place-items:center;font:700 28px ui-monospace,Consolas,monospace}.hint{position:absolute;left:23px;bottom:10px;right:18px;font:700 29px ui-monospace,Consolas,monospace;color:#f1c66b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.testimony{position:absolute;inset:10px 12px;background:#303536;color:#f5eee2;border:3px solid var(--suspect-color,#aaa);border-radius:12px;padding:18px 22px;display:none;z-index:4;box-shadow:0 9px 35px #000b;overflow:hidden}.testimony.show{display:block}.testimony h2{font-size:28px;color:var(--suspect-color,#eee);margin-bottom:9px}.testimony p{font-size:29px;line-height:1.22;margin:0;max-height:112px;overflow:auto}.testimony.truth p{font-weight:650}.testimony.cracked{animation:crack .55s ease-in-out}.objection-prompt{position:absolute;right:18px;bottom:12px;left:18px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:7px 12px;background:#171b1df2;border:1px solid #c39852;border-radius:7px;color:#f1c66b;font:700 27px/1.05 ui-monospace,Consolas,monospace}.objection-prompt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.objection-prompt b{flex:none;color:#fff}.sharp{position:absolute;right:14px;top:12px;background:var(--red);padding:8px 13px;font:700 28px ui-monospace,Consolas,monospace;z-index:6;animation:fadeout 4s forwards}.string-layer{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none;z-index:3;overflow:visible}.string-layer path{stroke:#c0342f;stroke-width:5;fill:none;filter:drop-shadow(0 0 5px #c0342f);stroke-dasharray:900;stroke-dashoffset:0;animation:string .45s ease-out}
.final{position:absolute;z-index:8;left:28px;bottom:270px;width:1272px;height:620px;background:#111e;color:#f5eee2;display:none;align-items:center;justify-content:center;padding:20px}.final.show{display:flex}.final-card{width:100%;max-height:100%;overflow:auto;padding:28px 34px;background:#202526;border:2px solid #c39852;border-radius:16px;box-shadow:0 25px 100px #000b}.final-card h1{font-size:38px;color:#f0c368;margin:7px 0}.final-card h2{font-size:32px;margin:12px 0}.final-card p{font-size:28px;line-height:1.2;margin:10px 0}.final-bars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px}.final-option{font-size:28px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sharp-list{font-size:28px;color:#f1c66b;margin-top:10px}
@keyframes flip{0%{transform:rotateY(90deg);opacity:.2}100%{transform:rotateY(0);opacity:1}}@keyframes crack{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-.4deg)}45%{transform:translateX(9px) rotate(.4deg)}70%{transform:translateX(-5px)}}@keyframes string{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}@keyframes fadeout{0%,75%{opacity:1}100%{opacity:0}}@keyframes drift{0%{transform:translate(-2%,-1%) scale(1)}100%{transform:translate(2%,1%) scale(1.08)}}
</style>
</head>
<body><div id="backdrop"><span>your stream here</span></div><main id="stage-root">
<svg class="string-layer" id="stringLayer" viewBox="0 0 1920 1080"><path id="stringPath" style="display:none"/></svg>
<section class="board" id="board"><svg class="board-strings" id="boardStrings" viewBox="0 0 560 1024" preserveAspectRatio="none"></svg><div class="board-heading"><div class="tag">CASE BOARD</div><div class="sim-pill" id="simPill">SIMULATED CHAT</div></div><h1 class="title" id="title"></h1><div class="intro" id="intro"></div><div class="suspects" id="suspects"></div><div class="evidence-title">RECOVERED EVIDENCE</div><div class="evidence-list" id="evidence"></div><div class="board-footer" id="boardFooter"></div></section>
<section class="stage-panel" id="stagePanel"><div class="stage-top"><div class="ballot"><h2 id="ballotTitle"></h2><div class="options" id="options"></div></div><div class="timer"><svg width="92" height="92" viewBox="0 0 80 80"><circle cx="40" cy="40" r="36"/><circle class="progress" id="progress" cx="40" cy="40" r="36"/></svg><b id="countdown">—</b></div></div><div class="hint" id="hint"></div><article class="testimony" id="testimony"></article><div id="sharp"></div></section>
<section class="final" id="final"><div class="final-card" id="finalCard"></div></section>
</main>
<script src="/overlay.js"></script></body></html>
